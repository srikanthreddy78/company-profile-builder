[project]
name = "company-profile-builder"
version = "0.1.0"
description = "CLI that builds a grounded company_brain.json from a company website using Deep Agents, LangGraph, OpenAI and Firecrawl."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "MIT" }
authors = [{ name = "Srikanth Reddy Gondireddy" }]
dependencies = [
  "deepagents==0.7.21",
  "langchain==1.4.3",
  "langgraph==1.2.12",
  "langchain-openai==1.6.7",
  "langgraph-checkpoint-sqlite==3.1.1",
  "firecrawl-py==4.46.2",
  "pydantic==2.13.5",
  "pydantic-settings>=2.6,<3",
  "typer==0.27.2",
  "rich==15.0.0",
  "rank-bm25==0.2.2",
  "numpy>=2.0,<3",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "jsonschema>=4.23,<5",
  "ruff>=0.8,<1",
  "pip-audit>=2.7,<3",
]

[project.scripts]
profile-builder = "profile_builder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profile_builder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608", "E501", "RUF012", "SIM108", "SIM105", "B008", "RUF001", "RUF002", "RUF003", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
